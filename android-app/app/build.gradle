plugins {
    alias(libs.plugins.android.application)
}

def configuredApiBaseUrl = providers.gradleProperty("joblensApiBaseUrl")
        .orElse(providers.environmentVariable("JOBLENS_API_BASE_URL"))
        .orElse("http://10.0.2.2:7999")
        .get()
def releaseKeystorePath = System.getenv("JOBLENS_KEYSTORE_PATH")

android {
    namespace 'ds.edu.cmu'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "ds.edu.cmu"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "API_BASE_URL", "\"${configuredApiBaseUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("JOBLENS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("JOBLENS_KEY_ALIAS")
                keyPassword System.getenv("JOBLENS_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.recyclerview
    implementation libs.okhttp
    implementation libs.gson
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
