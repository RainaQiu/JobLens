name: Publish Android APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Restore release keystore
        env:
          JOBLENS_KEYSTORE_BASE64: ${{ secrets.JOBLENS_KEYSTORE_BASE64 }}
        run: echo "$JOBLENS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/joblens-release.jks"
      - name: Build signed release APK
        working-directory: android-app
        env:
          JOBLENS_API_BASE_URL: ${{ secrets.JOBLENS_API_BASE_URL }}
          JOBLENS_KEYSTORE_PATH: ${{ runner.temp }}/joblens-release.jks
          JOBLENS_KEYSTORE_PASSWORD: ${{ secrets.JOBLENS_KEYSTORE_PASSWORD }}
          JOBLENS_KEY_ALIAS: ${{ secrets.JOBLENS_KEY_ALIAS }}
          JOBLENS_KEY_PASSWORD: ${{ secrets.JOBLENS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk JobLens-${GITHUB_REF_NAME}.apk
          gh release create "$GITHUB_REF_NAME" "JobLens-${GITHUB_REF_NAME}.apk" \
            --generate-notes --title "JobLens ${GITHUB_REF_NAME}"
